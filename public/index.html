<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Collab Dashboard</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #1a1a2e;
  --card: #16213e;
  --card-alt: #0f3460;
  --accent: #e94560;
  --text: #eaeaea;
  --text-dim: #8892a4;
  --radius: 10px;
  --pending: #f0c040;
  --claimed: #4a9eff;
  --done: #34d399;
  --error: #ef4444;
  --shadow: 0 2px 12px rgba(0,0,0,.35);
}

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 24px;
  background: var(--card);
  box-shadow: var(--shadow);
  z-index: 10;
  flex-shrink: 0;
}
header h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: .5px; }
#conn-status { display: flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--text-dim); }
#conn-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--error);
  transition: background .3s;
}
#conn-dot.connected { background: var(--done); box-shadow: 0 0 6px var(--done); }
#conn-dot.connecting { background: var(--pending); animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

main {
  display: grid;
  grid-template-columns: 260px 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 16px;
  padding: 16px 20px;
  flex: 1;
  min-height: 0;
}

.card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.card-title {
  padding: 12px 16px;
  font-weight: 600;
  font-size: .95rem;
  border-bottom: 1px solid rgba(255,255,255,.06);
  flex-shrink: 0;
}

#agent-panel { grid-row: 1 / 3; grid-column: 1; }
#agent-list { flex: 1; overflow-y: auto; padding: 8px; }

.agent-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: 8px; margin-bottom: 4px;
  transition: background .15s;
}
.agent-item:hover { background: rgba(255,255,255,.04); }
.agent-avatar {
  width: 34px; height: 34px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: .8rem; flex-shrink: 0; color: #fff;
}
.agent-info { min-width: 0; }
.agent-name { font-size: .9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.agent-role { font-size: .75rem; color: var(--text-dim); }
.agent-status-dot {
  width: 8px; height: 8px; border-radius: 50%; margin-left: auto; flex-shrink: 0;
}
.agent-status-dot.online { background: var(--done); box-shadow: 0 0 6px var(--done); }
.agent-status-dot.offline { background: var(--error); }
.agent-status-dot.idle { background: var(--pending); }

#task-panel { grid-row: 1; grid-column: 2; }
#task-table-wrap { flex: 1; overflow-y: auto; }
table { width: 100%; border-collapse: collapse; font-size: .85rem; }
thead th {
  position: sticky; top: 0; background: var(--card);
  padding: 8px 12px; text-align: left; font-weight: 600;
  color: var(--text-dim); border-bottom: 1px solid rgba(255,255,255,.06);
}
tbody td { padding: 8px 12px; border-bottom: 1px solid rgba(255,255,255,.04); }
tbody tr:hover { background: rgba(255,255,255,.03); }
.badge {
  display: inline-block; padding: 2px 10px; border-radius: 12px;
  font-size: .75rem; font-weight: 600; text-transform: uppercase;
}
.badge.pending { background: rgba(240,192,64,.18); color: var(--pending); }
.badge.claimed { background: rgba(74,158,255,.18); color: var(--claimed); }
.badge.done { background: rgba(52,211,153,.18); color: var(--done); }
.badge.error { background: rgba(239,68,68,.18); color: var(--error); }

#msg-panel { grid-row: 2; grid-column: 2; }
#msg-stream {
  flex: 1; overflow-y: auto; padding: 10px 14px;
  font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
  font-size: .8rem; line-height: 1.6; scroll-behavior: smooth;
  background: #0d0d1a;
}
.msg-line { white-space: pre; overflow: hidden; text-overflow: ellipsis; }
.msg-time { color: #555; }
.msg-agent { color: var(--accent); font-weight: 700; }
.msg-body { color: #ccc; }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 3px; }
</style>
</head>
<body>
<header>
  <h1>Agent Collab Dashboard</h1>
  <div id="conn-status">
    <span id="conn-dot"></span>
    <span id="conn-label">Disconnected</span>
  </div>
</header>
<main>
  <div class="card" id="agent-panel">
    <div class="card-title">Agents</div>
    <div id="agent-list"></div>
  </div>
  <div class="card" id="task-panel">
    <div class="card-title">Tasks</div>
    <div id="task-table-wrap">
      <table>
        <thead><tr><th>ID</th><th>Title</th><th>Status</th><th>Assignee</th></tr></thead>
        <tbody id="task-body"></tbody>
      </table>
    </div>
  </div>
  <div class="card" id="msg-panel">
    <div class="card-title">Live Event Stream</div>
    <div id="msg-stream"></div>
  </div>
</main>
<script>
const $ = s => document.querySelector(s);
const palette = ['#e94560','#4a9eff','#34d399','#f0c040','#a78bfa','#f97316','#06b6d4','#ec4899','#84cc16','#6366f1'];
let colorIdx = 0;
const agentColors = {};

function getAgentColor(name) {
  if (!agentColors[name]) agentColors[name] = palette[colorIdx++ % palette.length];
  return agentColors[name];
}
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function timeStr(ts) {
  const d = ts ? new Date(ts) : new Date();
  return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}
function pad(n) { return n < 10 ? '0' + n : '' + n; }

function renderAgents(agents) {
  const list = $('#agent-list');
  list.innerHTML = '';
  agents.forEach(a => {
    const div = document.createElement('div');
    div.className = 'agent-item';
    div.dataset.id = a.id;
    div.innerHTML =
      '<div class="agent-avatar" style="background:' + getAgentColor(a.name) + '">' + esc(a.name.charAt(0).toUpperCase()) + '</div>' +
      '<div class="agent-info"><div class="agent-name">' + esc(a.name) + '</div>' +
      '<div class="agent-role">' + esc(a.role || 'agent') + '</div></div>' +
      '<div class="agent-status-dot ' + (a.status || 'idle') + '"></div>';
    list.appendChild(div);
  });
}

function updateAgent(agent) {
  let el = $('#agent-list .agent-item[data-id="' + agent.id + '"]');
  if (!el) { renderAgents([agent]); return; }
  el.querySelector('.agent-status-dot').className = 'agent-status-dot ' + (agent.status || 'idle');
  if (agent.name) el.querySelector('.agent-name').textContent = agent.name;
  if (agent.role) el.querySelector('.agent-role').textContent = agent.role;
}

function taskRow(t) {
  const status = (t.status || 'pending').toLowerCase();
  const tr = document.createElement('tr');
  tr.dataset.id = t.id;
  tr.innerHTML = '<td>' + esc(String(t.id)) + '</td><td>' + esc(t.title || '') + '</td>' +
    '<td><span class="badge ' + status + '">' + status + '</span></td>' +
    '<td>' + esc(t.assignee || '—') + '</td>';
  return tr;
}

function renderTasks(tasks) {
  const tbody = $('#task-body');
  tbody.innerHTML = '';
  tasks.forEach(t => tbody.appendChild(taskRow(t)));
}

function updateTask(task) {
  const tbody = $('#task-body');
  let old = tbody.querySelector('tr[data-id="' + task.id + '"]');
  if (!old) { tbody.appendChild(taskRow(task)); return; }
  tbody.replaceChild(taskRow(task), old);
}

function appendEvent(data) {
  const stream = $('#msg-stream');
  const ts = timeStr(data.timestamp);
  const agent = data.agent || 'system';
  const detail = data.detail || data.message || '';
  const line = document.createElement('div');
  line.className = 'msg-line';
  line.innerHTML = '<span class="msg-time">[' + esc(ts) + ']</span> ' +
    '<span class="msg-agent">[' + esc(agent) + ']</span> ' +
    '<span class="msg-body"> ' + esc(detail) + '</span>';
  stream.appendChild(line);
  while (stream.children.length > 500) stream.removeChild(stream.firstChild);
  stream.scrollTop = stream.scrollHeight;
}

let ws = null;

function setConnState(state) {
  const dot = $('#conn-dot');
  const label = $('#conn-label');
  dot.className = state === 'connected' ? 'connected' : state === 'connecting' ? 'connecting' : '';
  label.textContent = state === 'connected' ? 'Connected' : state === 'connecting' ? 'Connecting...' : 'Disconnected';
}

function connect() {
  if (ws) { ws.close(); ws = null; }
  setConnState('connecting');
  ws = new WebSocket('ws://127.0.0.1:7890/ws');
  ws.onopen = function() { setConnState('connected'); };
  ws.onclose = function() { setConnState('disconnected'); setTimeout(connect, 3000); };
  ws.onerror = function() { ws.close(); };
  ws.onmessage = function(ev) {
    let msg;
    try { msg = JSON.parse(ev.data); } catch(e) { return; }
    switch (msg.type) {
      case 'init':
        if (msg.agents) renderAgents(msg.agents);
        if (msg.tasks) renderTasks(msg.tasks);
        if (msg.events) msg.events.forEach(appendEvent);
        break;
      case 'task_update':
        if (msg.task) updateTask(msg.task);
        break;
      case 'agent_update':
        if (msg.agent) updateAgent(msg.agent);
        break;
      case 'event':
        appendEvent(msg);
        break;
    }
  };
}

connect();
</script>
</body>
</html>
